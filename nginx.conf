server {
    listen 80 default_server;
    root /var/www/html;
    index index.html;

    # Captive portal detection — return 204 so iOS/Android show no popup
    location /hotspot-detect.html      { proxy_pass http://localhost:5000; }
    location /library/test/success.html { proxy_pass http://localhost:5000; }
    location /generate_204             { proxy_pass http://localhost:5000; }
    location /gen_204                  { return 204; }
    location /ncsi.txt                 { proxy_pass http://localhost:5000; }
    location /connecttest.txt          { return 204; }

    location / {
        try_files $uri $uri/ @fastapi;
    }

    location @fastapi {
        proxy_pass http://localhost:5000;
    }
}
